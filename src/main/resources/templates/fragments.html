<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
    <div class="brand">
        <div class="brand-mark">NX</div>
        <div>
            <h1>NEXUS</h1>
            <small class="muted">Estoque e vendas</small>
        </div>
    </div>
    <nav class="nav">
        <a th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/dashboard}">Dashboard</a>
        <a th:classappend="${active == 'produtos'} ? 'active'" th:href="@{/produtos}">Produtos</a>
        <a sec:authorize="hasRole('ADMINISTRADOR')" th:classappend="${active == 'estoque'} ? 'active'" th:href="@{/estoque}">Estoque</a>
        <a sec:authorize="hasRole('ADMINISTRADOR')" th:classappend="${active == 'categorias'} ? 'active'" th:href="@{/categorias}">Categorias</a>
        <a sec:authorize="hasRole('ADMINISTRADOR')" th:classappend="${active == 'fornecedores'} ? 'active'" th:href="@{/fornecedores}">Fornecedores</a>
        <form th:action="@{/logout}" method="post">
            <button class="logout-btn" type="submit">Sair</button>
        </form>
    </nav>
</aside>
<div th:fragment="alerts">
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>
</div>
</body>
</html>
