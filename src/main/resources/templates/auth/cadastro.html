<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('NEXUS | Cadastro')}"></head>
<body class="login-body">
<main class="login-card register-card">
    <div class="brand login-brand">
        <div class="brand-mark">NX</div>
        <div>
            <h1>Criar conta</h1>
            <p class="subtitle">Cadastre-se para acessar o NEXUS</p>
        </div>
    </div>

    <div class="security-note">
        <strong>Perfil padrão:</strong>
        novos cadastros entram como <strong>Funcionário</strong>.
    </div>

    <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

    <form th:action="@{/cadastro}" method="post" autocomplete="off">
        <div class="field">
            <label for="nome">Nome completo</label>
            <input
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    th:value="${nome}"
                    required
                    autofocus>
        </div>

        <div class="field">
            <label for="login">Login</label>
            <input
                    id="login"
                    name="login"
                    placeholder="Escolha um login"
                    th:value="${loginCadastro}"
                    required>
            <small class="field-help">Use pelo menos 3 caracteres, sem espaços.</small>
        </div>

        <div class="field">
            <label for="senha">Senha</label>
            <input
                    id="senha"
                    name="senha"
                    type="password"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required>
            <small class="field-help">A senha deve ter pelo menos 6 caracteres.</small>
        </div>

        <div class="field">
            <label for="confirmacaoSenha">Confirmar senha</label>
            <input
                    id="confirmacaoSenha"
                    name="confirmacaoSenha"
                    type="password"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    required>
        </div>

        <button class="btn btn-primary full" type="submit">
            Cadastrar conta
        </button>
    </form>

    <div class="auth-divider">
        <span>já possui acesso?</span>
    </div>

    <a class="btn btn-secondary full" th:href="@{/login}">
        Voltar para login
    </a>
</main>
</body>
</html>
